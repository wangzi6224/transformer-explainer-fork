name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Normalize import casing for Linux
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          for path in Path('src').rglob('*'):
              if path.suffix not in {'.svelte', '.ts', '.js'}:
                  continue

              content = path.read_text()
              fixed = content.replace('./popovers/', './Popovers/')
              if fixed != content:
                  path.write_text(fixed)
                  changed.append(str(path))

          if changed:
              print('Normalized import casing in:')
              for item in changed:
                  print(f'- {item}')
          else:
              print('No lowercase popovers imports found.')
          PY

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
